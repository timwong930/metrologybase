name: Generate catalog product photographs
on:
  push:
    branches: [feat/additel-catalog-local-photos]
    paths:
      - '.github/workflows/generate-additel-photos.yml'
      - 'scripts/extract-additel-photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF image extraction tools
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.5 pillow==11.3.0
      - name: Extract 45 manufacturer photographs from Additel's 2026 catalog
        run: python scripts/extract-additel-photos.py
      - name: Check that each catalog model has a locally hosted photograph
        run: |
          python - <<'PY'
          import json, pathlib
          entries=json.load(open('scripts/additel-catalog-data.json'))['items']
          assert len(entries)==45, f'Unexpected catalog count: {len(entries)}'
          for p in entries:
              prefix='accumac-' if p['model'].startswith('AM') else 'additel-'
              image=pathlib.Path('public/additel-catalog')/(prefix+p['model'].lower()+'.jpg')
              assert image.exists() and image.stat().st_size>1500, f'Invalid image for {p["model"]}'
          print('Validated all 45 local images.')
          PY
      - name: Save optimized, locally served catalog photos into this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/additel-catalog/
          if git diff --cached --quiet; then
            echo "All catalog photos already up to date"
            exit 0
          fi
          git commit -m "Bundle 45 manufacturer catalog product photos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
